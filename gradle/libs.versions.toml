[versions]
android-gradle = "8.0.2"
kotlin-gradle = "1.7.21"
activity-compose = "1.6.1"
compose-ver = "1.4.0-alpha02"
compose-constraintlayout = "1.0.1"
compose-navigation = "2.5.3"
coil-compose = "2.1.0"
kotlin-datetime = "0.4.0"
dagger-hilt = "2.44"
dagger-hilt-nav = "1.0.0"
ktor = "2.1.3"
sqldelight = "2.0.0"
assertK = "0.25"
turbine = "0.7.0"
junit = "4.13.2"
test-runner = "1.5.1"
mockk = "1.13.9"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose-ver" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose-ver" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose-ver" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose-ver" }
androidx-compose-material = { module = "androidx.compose.material:material", version.ref = "compose-ver" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose-ver" }

androidx-compose-constraintlayout = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "compose-constraintlayout" }

androidx-compose-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "compose-navigation" }

kotlin-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlin-datetime" }

dagger-hilt = { module = "com.google.dagger:hilt-android", version.ref = "dagger-hilt" }
dagger-hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "dagger-hilt" }
dagger-hilt-navigation = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "dagger-hilt-nav" }

coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil-compose" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-ios = { module = "io.ktor:ktor-client-ios", version.ref = "ktor" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }

assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertK" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
androidx-compose-ui-test-junit = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose-ver" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose-ver" }
dagger-hilt-test = { module = "com.google.dagger:hilt-android-testing", version.ref = "dagger-hilt" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle"}
android-library = { id = "com.android.library", version.ref = "android-gradle"}
kotlin-gradle = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin-gradle"}
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-gradle" }
hilt-gradle = { id = "com.google.dagger.hilt.android", version.ref = "dagger-hilt" }
sqlDelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
